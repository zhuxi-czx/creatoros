name: 生产健康巡检

# 从 GitHub 服务器（独立于生产机）定时探测 API 健康，宕机即告警。
# - 默认：workflow 失败时 GitHub 自动邮件通知仓库 owner。
# - 可选：在仓库 Settings → Secrets 配 PUSHPLUS_TOKEN，失败时额外推送微信。
on:
  schedule:
    - cron: '*/5 * * * *' # 每 5 分钟（GitHub 调度可能有几分钟延迟）
  workflow_dispatch: {} # 支持手动触发测试

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: 探测 API 健康
        id: check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://creatorbar.cn/api/health || echo "000")
          echo "HTTP 状态码: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then exit 0; else exit 1; fi

      - name: 失败时邮件告警到 QQ 邮箱（需配 QQ_MAIL_AUTH 授权码）
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: 505428389@qq.com
          password: ${{ secrets.QQ_MAIL_AUTH }}
          from: 敞开酒馆监控 <505428389@qq.com>
          to: 505428389@qq.com
          subject: 【敞开酒馆】生产告警 · API 健康检查失败
          body: |
            API 健康检查失败（HTTP ${{ steps.check.outputs.code }}）。
            请尽快检查：https://creatorbar.cn
            （来自 GitHub Actions 外部探针，每 5 分钟巡检一次）
